name: Build Android Debug APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-debug-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install web dependencies and sync Capacitor Android
        run: |
          npm install
          npm run build
          npx cap sync android

      - name: Setup Temurin Java 21
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-home-cache-cleanup: true

      - name: Accept Android SDK licenses
        run: |
          if [ -n "$ANDROID_HOME" ] && [ -x "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" ]; then
            yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null 2>&1 || true
          fi

      - name: Build Android Debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace --no-daemon

      - name: Verify Debug APK
        run: |
          APK_PATH="android/app/build/outputs/apk/debug/app-debug.apk"
          if [ ! -f "$APK_PATH" ] || [ ! -s "$APK_PATH" ]; then
            echo "Error: Expected debug APK not found at $APK_PATH"
            find android/app/build/outputs/apk -name "*.apk" || true
            exit 1
          fi
          ls -lh "$APK_PATH"

      - name: Upload debug APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Prepare APK release asset
        id: prepare_asset
        run: |
          TMP_DIR="$(mktemp -d)"
          REPO_NAME="$(echo "${GITHUB_REPOSITORY##*/}" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')"
          ASSET_NAME="${REPO_NAME}-debug-build-${GITHUB_RUN_NUMBER}.apk"
          cp android/app/build/outputs/apk/debug/app-debug.apk "${TMP_DIR}/${ASSET_NAME}"
          echo "asset_path=${TMP_DIR}/${ASSET_NAME}" >> "$GITHUB_OUTPUT"
          echo "asset_name=${ASSET_NAME}" >> "$GITHUB_OUTPUT"

      - name: Publish APK to GitHub Releases
        id: publish_release
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh --version
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          gh release create "$TAG" "${{ steps.prepare_asset.outputs.asset_path }}" \
            --target "${{ github.sha }}" \
            --title "Debug APK Build #${GITHUB_RUN_NUMBER}" \
            --notes "Automatically built debug APK for testing via GitHub Actions (Run #${GITHUB_RUN_NUMBER}, Attempt ${GITHUB_RUN_ATTEMPT}, Commit ${GITHUB_SHA})." \
            --latest

      - name: Report APK download result
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="debug-apk-build-${GITHUB_RUN_NUMBER}-${GITHUB_RUN_ATTEMPT}"
          if [ "${{ steps.publish_release.outcome }}" = "success" ]; then
            RELEASE_URL="$(gh release view "$TAG" --json url -q .url)"
            echo "Release created: $RELEASE_URL"
            echo "### APK Build & Release Succeeded" >> "$GITHUB_STEP_SUMMARY"
            echo "- Release URL: $RELEASE_URL" >> "$GITHUB_STEP_SUMMARY"
            echo "- Asset: ${{ steps.prepare_asset.outputs.asset_name }}" >> "$GITHUB_STEP_SUMMARY"
          else
            echo "::warning::Release publishing failed, but the APK build succeeded and the 'app-debug-apk' Actions artifact is available."
            echo "### APK Build Succeeded (Release Warning)" >> "$GITHUB_STEP_SUMMARY"
            echo "Download the APK from the workflow's **app-debug-apk** artifact." >> "$GITHUB_STEP_SUMMARY"
          fi
